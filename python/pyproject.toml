[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qsim-tutorial"
version = "0.1.0"
description = "An educational statevector simulator with checked quantum operations"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
reference = ["cirq-core==1.7.0"]
qsharp = ["qdk==1.32.3", "pyqir==0.12.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qsim_tutorial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["reference: independent optional Cirq comparison", "qsharp: optional QDK companion validation"]
